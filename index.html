<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nouvelle alerte</title>
<script type="module">
  import { fr } from 'https://unpkg.com/chrono-node@2.10.1/dist/esm/index.js';
  window.chrono = { fr };
</script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 20px auto; padding: 0 12px; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-size: 16px; }
    .checkboxes { display: flex; gap: 20px; margin-top: 14px; }
    .checkboxes label { display: flex; align-items: center; gap: 6px; font-weight: normal; }
    button { margin-top: 20px; width: 100%; padding: 12px; font-size: 16px; background: #1a73e8; color: white; border: none; border-radius: 6px; }
    #btnDictee { background: #34a853; margin-top: 0; margin-bottom: 10px; }
    #statut { margin-top: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Nouvelle alerte</h2>
  <button type="button" id="btnDictee">🎤 Dictée vocale</button>
  <div id="texteDicte" style="font-style:italic;color:#555;"></div>

  <form id="formAlerte">
    <label for="dateHeure">Date et heure</label>
    <input type="datetime-local" id="dateHeure" required>

    <label for="message">Message</label>
    <input type="text" id="message" required>

    <div class="checkboxes">
      <label><input type="checkbox" id="email"> Email</label>
      <label><input type="checkbox" id="whatsapp" checked> WhatsApp</label>
    </div>

    <label for="commentaire">Commentaire</label>
    <textarea id="commentaire" rows="3"></textarea>

    <label for="pieceJointe">Pièce jointe (photo/PDF)</label>
    <input type="file" id="pieceJointe" accept="image/*,application/pdf" capture="environment">

    <button type="submit">Enregistrer</button>
    <div id="statut"></div>
  </form>

  <script>
    // ⚠️ Remplace par l'URL de ton déploiement Apps Script (se termine par /exec)
    const URL_API = 'https://script.google.com/macros/s/AKfycbxVrT5sptdzvvpyM1hQpILDv3l-Ket4eIMMKCo69K61rjAVE1wMkvOyK0D7pMRb_lY/exec';

    document.getElementById('btnDictee').addEventListener('click', function () {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('Reconnaissance vocale non supportée sur ce navigateur (utilise Chrome).');
        return;
      }
      const reconnaissance = new SpeechRecognition();
      reconnaissance.lang = 'fr-FR';
      reconnaissance.interimResults = false;
      document.getElementById('texteDicte').textContent = '🎙️ Écoute en cours...';

      reconnaissance.onresult = function (event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById('texteDicte').textContent = '📝 « ' + transcript + ' »';
        const resultats = chrono.fr.parse(transcript, new Date(), { forwardDate: true });
        if (resultats.length > 0) {
          const dateDetectee = resultats[0].start.date();
          const texteDate = resultats[0].text;
          document.getElementById('dateHeure').value = formaterDateTimeLocal(dateDetectee);
          const messageRestant = transcript.replace(texteDate, '').trim();
          document.getElementById('message').value = messageRestant || transcript;
        } else {
          document.getElementById('message').value = transcript;
        }
      };

      reconnaissance.onerror = function (event) {
        document.getElementById('texteDicte').textContent = '❌ Erreur : ' + event.error;
      };

      reconnaissance.start();
    });

    function formaterDateTimeLocal(date) {
      const pad = function (n) { return String(n).padStart(2, '0'); };
      return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate())
        + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
    }

    document.getElementById('formAlerte').addEventListener('submit', function (e) {
      e.preventDefault();
      const statut = document.getElementById('statut');
      statut.textContent = 'Enregistrement...';

      const donnees = {
        dateHeure: document.getElementById('dateHeure').value,
        message: document.getElementById('message').value,
        email: document.getElementById('email').checked,
        whatsapp: document.getElementById('whatsapp').checked,
        commentaire: document.getElementById('commentaire').value,
      };

      const fichier = document.getElementById('pieceJointe').files[0];

      function envoyer(fichierBase64, nomFichier, typeMime) {
        donnees.fichierBase64 = fichierBase64;
        donnees.nomFichier = nomFichier;
        donnees.typeMime = typeMime;

        fetch(URL_API, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(donnees),
        })
          .then(function (r) { return r.json(); })
          .then(function (reponse) {
            if (reponse.ok) {
              statut.textContent = '✅ Alerte enregistrée !';
              document.getElementById('formAlerte').reset();
              document.getElementById('whatsapp').checked = true;
              document.getElementById('texteDicte').textContent = '';
            } else {
              statut.textContent = '❌ Erreur : ' + reponse.erreur;
            }
          })
          .catch(function (err) {
            statut.textContent = '❌ Erreur réseau : ' + err.message;
          });
      }

      if (fichier) {
        const reader = new FileReader();
        reader.onload = function () {
          envoyer(reader.result.split(',')[1], fichier.name, fichier.type);
        };
        reader.readAsDataURL(fichier);
      } else {
        envoyer(null, null, null);
      }
    });
  </script>
</body>
</html>
